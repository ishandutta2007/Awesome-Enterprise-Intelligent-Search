<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Pill Gradient 1 -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pill Gradient 2 -->
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes gridPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.3; }
    }

    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }

    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
    }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .grid-bg {
      animation: gridPulse 6s ease-in-out infinite;
    }

    .pill-1 {
      animation: floatPill1 7s ease-in-out infinite;
    }

    .pill-2 {
      animation: floatPill2 9s ease-in-out infinite;
    }

    .node {
      animation: pulseNode 3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .node-delay-1 { animation-delay: 0.7s; }
    .node-delay-2 { animation-delay: 1.4s; }
    .node-delay-3 { animation-delay: 2.1s; }

    .wave-line {
      stroke-dasharray: 10 15;
      animation: waveMove 20s linear infinite;
    }

    /* Foreground title protection: high opacity, crisp text shadow */
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }

    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/>

  <!-- Background Grid Pattern -->
  <g class="grid-bg" stroke="#38bdf8" stroke-width="1" opacity="0.2">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Ambient Animated Graph Connections (Behind Content) -->
  <g opacity="0.3">
    <!-- Connecting dashed lines -->
    <path d="M 150 90 L 300 60 L 450 100 L 950 80 L 1050 130" stroke="#38bdf8" stroke-width="1.5" fill="none" class="wave-line"/>
    <path d="M 100 320 L 250 340 L 850 330 L 1080 300" stroke="#818cf8" stroke-width="1.5" fill="none" class="wave-line"/>

    <!-- Dynamic Nodes -->
    <circle cx="150" cy="90" r="5" fill="#38bdf8" class="node"/>
    <circle cx="300" cy="60" r="4" fill="#818cf8" class="node node-delay-1"/>
    <circle cx="450" cy="100" r="6" fill="#c084fc" class="node node-delay-2"/>
    <circle cx="950" cy="80" r="5" fill="#38bdf8" class="node node-delay-3"/>
    <circle cx="1050" cy="130" r="4" fill="#818cf8" class="node"/>

    <circle cx="100" cy="320" r="5" fill="#818cf8" class="node node-delay-1"/>
    <circle cx="250" cy="340" r="6" fill="#38bdf8" class="node node-delay-2"/>
    <circle cx="850" cy="330" r="4" fill="#c084fc" class="node node-delay-3"/>
    <circle cx="1080" cy="300" r="5" fill="#38bdf8" class="node"/>
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Pills positioned safely around title) -->
  <!-- Top Right Dynamic Pill / Badge -->
  <g class="pill-1">
    <rect x="830" y="45" width="230" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="852" cy="64" r="6" fill="#38bdf8" class="node"/>
    <text x="868" y="69" class="badge-text">Hybrid Retrieval &amp; BM25</text>
  </g>

  <!-- Top Left Dynamic Pill -->
  <g class="pill-2">
    <rect x="140" y="45" width="220" height="38" rx="19" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="162" cy="64" r="6" fill="#a855f7" class="node node-delay-1"/>
    <text x="178" y="69" class="badge-text">RAG &amp; Vector Search</text>
  </g>

  <!-- Bottom Left Dynamic Pill -->
  <g class="pill-1">
    <rect x="140" y="315" width="240" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="162" cy="334" r="6" fill="#38bdf8" class="node node-delay-2"/>
    <text x="178" y="339" class="badge-text">Enterprise Data Connectors</text>
  </g>

  <!-- Bottom Right Dynamic Pill -->
  <g class="pill-2">
    <rect x="820" y="315" width="240" height="38" rx="19" fill="url(#pillGrad2)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="842" cy="334" r="6" fill="#c084fc" class="node node-delay-3"/>
    <text x="858" y="339" class="badge-text">RBAC &amp; Knowledge Graphs</text>
  </g>

  <!-- CENTER PIECE: TITLE & SUBTITLE IN FOREGROUND (Completely unobscured) -->
  <rect x="120" y="115" width="960" height="170" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" filter="url(#glow)"/>

  <!-- Search Icon Graphic -->
  <g transform="translate(600, 145)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="node"/>
    <circle cx="0" cy="0" r="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <path d="M-6 -6 L-1 -1 M2 2 A 6 6 0 1 0 -6 -6 A 6 6 0 0 0 2 2 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" transform="scale(1.8)"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="215" text-anchor="middle" fill="url(#titleGradient)" class="banner-title" filter="url(#softGlow)">
    Awesome Enterprise Intelligent Search
  </text>

  <!-- Subtitle -->
  <text x="600" y="252" text-anchor="middle" fill="url(#subGradient)" class="banner-subtitle">
    Curated Commercial Platforms &amp; Open-Source Engines for Semantic Discovery &amp; RAG
  </text>
</svg>
