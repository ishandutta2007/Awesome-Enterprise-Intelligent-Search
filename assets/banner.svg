<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-200px); }
        100% { transform: translateY(400px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6; fill: #38bdf8; }
        50% { r: 9; fill: #f43f5e; }
      }
      .bg-blob { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .node { animation: nodePulse 3s ease-in-out infinite; }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="bg-blob" cx="200" cy="100" r="180" fill="#0284c7" filter="url(#glow)" opacity="0.4"/>
  <circle class="bg-blob" cx="1000" cy="300" r="220" fill="#7e22ce" filter="url(#glow)" opacity="0.3"/>
  <circle class="bg-blob" cx="600" cy="380" r="150" fill="#be185d" filter="url(#glow)" opacity="0.25"/>

  <!-- Network / Search Knowledge Graph Visual Elements (Background Side Graphics) -->
  <g opacity="0.25">
    <line x1="850" y1="100" x2="980" y2="160" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="980" y1="160" x2="1050" y2="90" stroke="#818cf8" stroke-width="2"/>
    <line x1="980" y1="160" x2="1100" y2="240" stroke="#818cf8" stroke-width="2"/>
    <line x1="850" y1="100" x2="780" y2="200" stroke="#818cf8" stroke-width="2"/>
    <line x1="780" y1="200" x2="900" y2="280" stroke="#818cf8" stroke-width="2"/>

    <circle cx="850" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="980" cy="160" r="8" fill="#818cf8" class="node"/>
    <circle cx="1050" cy="90" r="5" fill="#c084fc"/>
    <circle cx="1100" cy="240" r="7" fill="#38bdf8"/>
    <circle cx="780" cy="200" r="6" fill="#f43f5e"/>
    <circle cx="900" cy="280" r="7" fill="#818cf8"/>
  </g>

  <!-- Decorative Glassmorphic Floating Search Card (Right Side) -->
  <g class="floating-card" transform="translate(750, 110)">
    <rect width="380" height="180" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    <!-- Mock Search Bar -->
    <rect x="24" y="24" width="332" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <path d="M40 45 A 6 6 0 1 0 40 33 A 6 6 0 1 0 40 45 Z M45 43 L52 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="60" y="50" font-family="sans-serif" font-size="14" fill="#cbd5e1">Query: "Enterprise RAG & Hybrid Retrieval"</text>
    
    <!-- Vector Match Pills -->
    <rect x="24" y="85" width="100" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="34" y="102" class="badge-text">Vector Search</text>
    
    <rect x="132" y="85" width="110" height="26" rx="6" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="142" y="102" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">Semantic Graph</text>

    <rect x="250" y="85" width="106" height="26" rx="6" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="260" y="102" font-family="sans-serif" font-size="13" font-weight="600" fill="#fb7185">Sub-50ms RAG</text>

    <text x="24" y="142" font-family="sans-serif" font-size="12" fill="#64748b">100+ Enterprise Connectors • Self-Hosted &amp; SaaS</text>
  </g>

  <!-- Foreground Title and Subtitle Block (Guaranteed Clear & Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">🔍 ENTERPRISE INTELLIGENT SEARCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text" font-size="44" letter-spacing="-0.5">
      Awesome Enterprise
    </text>
    <text x="0" y="215" class="title-text" font-size="44" fill="url(#accent-grad)" letter-spacing="-0.5">
      Intelligent Search ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" class="subtitle-text" font-size="17">
      Curated Commercial Platforms &amp; Self-Hosted Open-Source Search Engines
    </text>
    <text x="0" y="288" class="subtitle-text" font-size="15" fill="#64748b">
      Vector Search • RAG Pipelines • Knowledge Graphs • Permissions-Aware Retrieval
    </text>

    <!-- Feature Dots -->
    <g transform="translate(0, 320)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="20" y="12" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">Elasticsearch &amp; OpenSearch</text>

      <circle cx="210" cy="8" r="4" fill="#818cf8"/>
      <text x="222" y="12" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">Glean &amp; Kendra</text>

      <circle cx="350" cy="8" r="4" fill="#c084fc"/>
      <text x="362" y="12" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">Vector DBs &amp; Meilisearch</text>
    </g>
  </g>
</svg>
